services:
    iqdb-labeler:
        build: .
        ports:
            - "4100:4100"
        env_file: .env
        volumes:
            - ./models:/app/models:ro
            - ./danbooru-data:/app/danbooru-data:ro
            - ./cursor.txt:/app/cursor.txt
            - ./labels.db:/app/database/labels.db
            - ./labels.db-shm:/app/database/labels.db-shm
            - ./labels.db-wal:/app/database/labels.db-wal
        restart: unless-stopped
        environment:
            - DB_PATH=/app/database/labels.db

volumes:
    db:
